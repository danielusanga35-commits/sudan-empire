<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment | SuDan Empire</title><style>body{margin:0;background:#080808;color:#fff;font:16px Arial;display:grid;place-items:center;min-height:100vh;text-align:center}.box{max-width:560px;padding:45px;border:1px solid #4c3d14;border-radius:22px;background:#111}.g{color:#d4af37;font:700 42px Georgia}a{display:inline-block;margin-top:20px;padding:12px 18px;border:1px solid #d4af37;color:#d4af37;border-radius:999px;text-decoration:none}</style></head><body><div class="box"><div class="g">Thank You</div><p id="msg">Checking your Paystack payment securely…</p><p>You can return to the store. Your order status will update after payment confirmation.</p><script>const ref=new URLSearchParams(location.search).get("reference");if(ref){fetch("/api/paystack/confirm/"+encodeURIComponent(ref)).then(r=>r.json()).then(d=>{document.getElementById("msg").textContent=d.status==="success"?"Payment confirmed. Your SuDan Empire order is now being processed.":"We received your return from Paystack. Payment status: "+(d.status||"pending")}).catch(()=>document.getElementById("msg").textContent="We received your return from Paystack. Please allow a moment for confirmation.")}</script><a href="/">Return to SuDan Empire</a></div></body></html>
